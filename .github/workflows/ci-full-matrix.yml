name: ci-full-matrix

on:
  workflow_dispatch:

jobs:
  compile-groups:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: legacy-existing
            java: "21"
            targets: "1.18.2-fabric,1.18.2-forge,1.20.1-fabric,1.20.1-forge,1.20.2-fabric,1.20.2-neoforge"
          - name: fabric-new
            java: "21"
            targets: "1.19.2-fabric,1.19.4-fabric,1.20.4-fabric,1.20.6-fabric,1.21.1-fabric,1.21.3-fabric,1.21.5-fabric,1.21.8-fabric,1.21.11-fabric"
          - name: forge-new
            java: "21"
            targets: "1.19.2-forge,1.19.4-forge"
          - name: neoforge-new
            java: "21"
            targets: "1.20.4-neoforge,1.20.6-neoforge,1.21.1-neoforge,1.21.3-neoforge,1.21.5-neoforge,1.21.8-neoforge,1.21.11-neoforge"
          - name: v26
            java: "25"
            targets: "26.1-fabric,26.1-neoforge"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Validate version matrix metadata
        shell: pwsh
        run: ./scripts/validate-version-matrix.ps1

      - name: Compile target group
        shell: pwsh
        run: ./gradlew.bat compileJava --no-daemon "-PtargetProjects=${{ matrix.targets }}"
