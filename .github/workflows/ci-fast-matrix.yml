name: ci-fast-matrix

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate-and-smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate version matrix metadata
        shell: pwsh
        run: ./scripts/validate-version-matrix.ps1

      - name: Verify dynamic target registration
        shell: pwsh
        run: ./gradlew.bat projects --no-daemon "-PtargetProjects=1.20.1-fabric,1.19.2-fabric,1.21.11-neoforge"

      - name: Compile smoke targets
        shell: pwsh
        run: ./gradlew.bat :1.20.1-fabric:compileJava :1.20.2-neoforge:compileJava --no-daemon "-PtargetProjects=1.20.1-fabric,1.20.2-neoforge"
